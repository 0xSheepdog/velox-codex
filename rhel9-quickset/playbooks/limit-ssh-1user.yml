---
# =============================================================================
# Limit SSH access to a single user / no-password logins
## Prompts for the username to allow SSH access (only 1 user)
# =============================================================================
- name: Configure SSH restrictions
  hosts: all
  become: true
  gather_facts: false

  vars_prompt:
    - name: ssh_allowed_user
      prompt: "Enter the username (only 1 user) to allow SSH access"
      private: false

  tasks:
    - name: Deploy SSH restrictions drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-restrict-access.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          # Managed by Ansible — do not edit manually
          PasswordAuthentication no
          AllowUsers {{ ssh_allowed_user }}
      notify: Reload sshd

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd:
        name: sshd
        state: reloaded
